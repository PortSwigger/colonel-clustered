plugins {
    id 'java'
    id 'idea'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version = '1.0.0'
description = 'A Burp Suite extension for clustering HTTP responses to find outliers.'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'net.portswigger.burp.extensions:montoya-api:2023.10'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

shadowJar {
    archiveBaseName.set('ColonelClustered')
    archiveClassifier.set('')
    archiveVersion.set('')
}