plugins {
    id 'java'
    id 'idea'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.portswigger.burp.extensions:montoya-api:2023.10'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.github.haifengl:smile-core:2.6.0'
    implementation 'com.github.haifengl:smile-nlp:2.6.0'
    implementation 'com.github.haifengl:smile-nlp:2.6.0'
    implementation 'com.github.haifengl:smile-plot:2.6.0'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

shadowJar {
    archiveBaseName.set('ColonelClustered')
    archiveClassifier.set('')
    archiveVersion.set('')
}